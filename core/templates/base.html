<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CampusShare{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">CampusShare</a>
        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm me-2" href="#">Login</a>
            <a class="btn btn-light btn-sm" href="#">Register</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted py-4 border-top">
    CampusShare &copy; 2026
</footer>

</body>
</html>
