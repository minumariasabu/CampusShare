{% extends "base.html" %}

{% block title %}Page not found - CampusShare{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-primary">404</div>
    <h1 class="h3">Page not found</h1>
    <p class="text-muted">This page doesn't exist, or you don't have access to it.</p>
    <a href="{% url 'home' %}" class="btn btn-primary">Go to home</a>
    {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="btn btn-outline-primary ms-2">My dashboard</a>
    {% endif %}
</div>
{% endblock %}
