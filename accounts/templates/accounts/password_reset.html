{% extends "base.html" %}
{% block title %}Forgot password - CampusShare{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h1 class="h3 mb-3 text-center">Forgot password?</h1>
        <p class="text-muted text-center">Enter your college email and we'll send you a reset link.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_email" class="form-label">College email</label>
                <input type="email" name="email" id="id_email" class="form-control" required autofocus>
                {% for error in form.email.errors %}
                    <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-primary w-100">Send reset link</button>
        </form>
        <p class="text-center mt-3"><a href="{% url 'login' %}">Back to login</a></p>
    </div>
</div>
{% endblock %}
